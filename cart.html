<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopSphere | Cart & Checkout</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top"><div class="container"><a class="navbar-brand fw-bold" href="index.html">ShopSphere</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button><div id="nav" class="collapse navbar-collapse"><ul class="navbar-nav ms-auto align-items-lg-center">
<li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="products.html">Products</a></li><li class="nav-item"><a class="nav-link" href="contact.html">Contact / Help</a></li><li class="nav-item ms-lg-2"><a class="btn btn-warning btn-sm" href="cart.html">Cart <span id="cartCount" class="badge text-bg-dark">0</span></a></li>
</ul></div></div></nav>
<main class="container py-5"><h1 class="fw-bold mb-4">Shopping Cart</h1><div class="row g-4"><div class="col-lg-8"><div id="cartItems"></div></div>
<div class="col-lg-4"><div class="card shadow-sm"><div class="card-body"><h4>Order Summary</h4><hr><div class="d-flex justify-content-between"><span>Subtotal</span><strong id="subtotal">₹0</strong></div><div class="d-flex justify-content-between"><span>Delivery</span><strong>₹49</strong></div><hr><div class="d-flex justify-content-between fs-5"><span>Total</span><strong id="total">₹49</strong></div><button id="checkoutBtn" class="btn btn-dark w-100 mt-3">Proceed to Checkout</button></div></div></div></div></main>
<div class="modal fade" id="checkoutModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form id="checkoutForm"><div class="modal-header"><h5 class="modal-title">Checkout</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">
<div class="mb-3"><label class="form-label">Full Name</label><input required class="form-control"></div><div class="mb-3"><label class="form-label">Email</label><input required type="email" class="form-control"></div><div class="mb-3"><label class="form-label">Delivery Address</label><textarea required class="form-control" rows="3"></textarea></div><div class="mb-3"><label class="form-label">Payment Method</label><select class="form-select"><option>Cash on Delivery</option><option>Demo Card Payment</option></select></div></div><div class="modal-footer"><button class="btn btn-success">Place Order</button></div></form></div></div></div>
<script src="js/products-data.js"></script><script src="js/app.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
